[package]
name = "exhibit-web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The browser shell around a session, compiled to WebAssembly and run in a Web Worker.
[lib]
crate-type = ["cdylib"]

[dependencies]
exhibit-domain = { path = "../crates/domain" }
exhibit-data = { path = "../crates/data" }
exhibit-session = { path = "../crates/session" }
serde = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
